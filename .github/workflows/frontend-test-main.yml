name: Frontend Test Main

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: frontend-test-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test
        uses: ./.github/actions/frontend-test
